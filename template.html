<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Капитал</title>
<style>
  :root { --bg: #f7f4ee; --fg: #222; --muted: #777; --line: #ddd5c8; --accent: #8a2b1e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1a18; --fg: #ddd8cf; --muted: #8d877d; --line: #36332e; --accent: #e08a74; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 19px/1.65 Georgia, "PT Serif", serif; }
  nav { position: fixed; inset: 0 auto 0 0; width: 300px; overflow-y: auto; padding: 24px 16px;
        border-right: 1px solid var(--line); font: 14px/1.4 system-ui, sans-serif; }
  nav ol { padding-left: 0; list-style: none; margin: 0; }
  nav li { margin-bottom: 8px; }
  nav li.sub { padding-left: 14px; font-size: 13px; }
  nav a { color: var(--muted); text-decoration: none; }
  nav a:hover, nav a.on { color: var(--accent); }
  main { margin-left: 300px; padding: 40px 24px 30vh; }
  section { max-width: 34em; margin: 0 auto 4em; }
  h2 { font-size: 1.3em; line-height: 1.3; margin: 0 0 1.2em; padding-top: 1em; border-top: 1px solid var(--line); }
  p { margin: 0 0 .9em; text-indent: 1.5em; hyphens: auto; }
  blockquote { margin: 0 0 .9em 1.5em; padding-left: 1em; border-left: 2px solid var(--line); color: var(--muted); font-size: .92em; }
  #toggle { display: none; }
  @media (max-width: 800px) {
    nav { width: 85%; background: var(--bg); transform: translateX(-100%); transition: transform .2s ease-out; z-index: 2; }
    nav.open { transform: none; }
    main { margin-left: 0; padding: 56px 16px 30vh; }
    #toggle { display: block; position: fixed; top: 10px; left: 10px; z-index: 3; padding: 6px 12px;
              background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; font: 14px system-ui; }
  }
</style>
</head>
<body>
<button id="toggle">Главы</button>
<nav><ol>{{TOC}}</ol></nav>
<main>{{BODY}}</main>
<script>
  const nav = document.querySelector('nav');
  document.getElementById('toggle').onclick = () => nav.classList.toggle('open');
  nav.onclick = e => { if (e.target.tagName === 'A') nav.classList.remove('open'); };

  // запоминаем место чтения
  try { const y = localStorage.getItem('kapital-y'); if (y && !location.hash) scrollTo(0, +y); } catch {}
  let t;
  addEventListener('scroll', () => {
    clearTimeout(t);
    t = setTimeout(() => { try { localStorage.setItem('kapital-y', scrollY); } catch {} }, 300);
  });

  // подсветка текущей главы в оглавлении
  const links = [...nav.querySelectorAll('a')];
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle('on', a.hash === '#' + e.target.id));
  }), { rootMargin: '0px 0px -80% 0px' });
  document.querySelectorAll('section').forEach(s => io.observe(s));
</script>
</body>
</html>
